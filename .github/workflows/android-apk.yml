name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Android native tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Build web
        run: npm run build

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install native PTY
        run: npm run android:native

      - name: Verify NativeTerminal registration
        run: |
          echo "=== MainActivity ==="
          find android/app/src/main -type f -name 'MainActivity.*' -print -exec sed -n '1,120p' {} \;
          echo "=== NativeTerminal plugin ==="
          find android/app/src/main -type f -name 'NativeTerminalPlugin.java' -print -exec sed -n '1,80p' {} \;
          test -n "$(find android/app/src/main -type f -name 'MainActivity.*' -print -exec grep -l 'registerPlugin(NativeTerminalPlugin' {} \;)"
          test -n "$(find android/app/src/main -type f -name 'NativeTerminalPlugin.java' -print -exec grep -l '@CapacitorPlugin(name = "NativeTerminal")' {} \;)"

      - name: Verify native Kotlin sources
        run: |
          test -s android/app/src/main/java/dev/hunterkritik/vsmobile/terminal/NativeTerminalPlugin.java
          test -s android/app/src/main/java/dev/hunterkritik/vsmobile/terminal/pty/PtyBridge.java
          test -s android/app/src/main/cpp/vsmobile_pty.cpp
          grep -R "org.jetbrains.kotlin.android\|kotlin-android" android/app/build.gradle android/app/build.gradle.kts android/build.gradle 2>/dev/null || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify artifact
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vs-code-mobile-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
